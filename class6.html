<!DOCTYPE html>
<html>
    <head>
        <style>

            body{
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                background: midnightblue;
                text-align: center;
                padding: 30px;
                color: rgb(255, 0, 0);
            }
            h1{
                color: rgb(255, 94, 0);
            }

            #zoo{
                border: 2px solid blueviolet;
                width: 300px;
                margin: 16px auto;
                padding:12px;
                border-radius: 10px;
                background-color: midnightblue;
            }
            .zone{
                border: 1px solid midnightblue;
                margin: 6px 0;
                padding: 8px 12px;
                border-radius: 6px;
                text-align: left;
            }
            button{
                background: midnightblue;
                color:white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
                font-size: larger;

            }
        </style>
    </head>
    <body>
        <h1>My Zoo</h1>
        <p>Use JavaScript and the DOM to add animals to each cage!</p>

        <div id="zoo">
            <div class="zone">Zone 1: <span id="zone1"></span></div>
            <div class="zone">Zone 2: <span id="zone2"></span></div>
            <div class="zone">Zone 3: <span id="zone3"></span></div>
            <div class="zone">Total animals: <span id="result"></span></div>
        </div>

        <br>

        <button onclick="openzoo()">Open the Zoo</button>

        <p id="zoo-status"></p>

        <script>
            function openzoo(){
                document.getElementById("zone1").innerHTML = "Lion";
                document.getElementById("zone2").innerHTML = "Elephant";
                document.getElementById("zone3").innerHTML = "Tiger";
                document.getElementById("result").innerHTML = "3";

                document.getElementById("zoo").style.backgroundColor = "aqua";
                document.getElementById("zoo-status").innerHTML = document.title + "Is now Open!!!";
            }
        </script>
    </body>
</html>
