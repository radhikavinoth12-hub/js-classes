<!DOCTYPE html>
<html>

<head>
    <title>Digital Clock</title>
    <style>
        body{
            background-image: linear-gradient(to right, darkblue, blueviolet, blue, violet);
            color:crimson;
        }
        button{
            color:blueviolet;
            font-size: medium;
        }
        div{
            font-size:xx-large;
            color:rgb(240, 128, 0);
        }
    </style>
</head>

<body >
    <center>
    <h1>Digital Clock</h1>
    <button onclick="showTime()"> Click the Button to Display Time</button>
    <br>
    <br>
    <br>

    <br>   
    <div id="MyClockDisplay"></div>
    <script>
        function showTime() {
            var date = new Date();
            var h = date.getHours();
            var m = date.getMinutes();
            var s = date.getSeconds();
            var session = "AM";
            if (h > 12) {
                h = h - 12;
                session = "PM";
            }
            h = (h < 10) ? "0" + h : h;
            m = (m < 10) ? "0" + m : m;
            s = (s < 10) ? "0" + s : s;
            var time = h + ":" + m + ":" + s + " " + session;
            document.getElementById("MyClockDisplay").innerText = time;
            setTimeout(showTime, 1000);
        }
    </script>
    </center>
</body>

</html>
