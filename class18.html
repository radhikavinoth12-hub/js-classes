<!DOCTYPE html>
<html>
    <head>
        <title>Random Dice Roller</title>
        <style>
            body {
                text-align: center;
                font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif
            }
            #dice {
                font-size: 320px;
            }
            #dice:hover {
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <center>
            <h1>Random Dice Roller</h1>
            <p>Click to roll the dice!</p>
            <div id="dice" onclick="stopStart()"></div>
            <script>
                //dice image from value 1 to 6 are given in an array codes are from Die face emojipedia
                var dices = ['&#9856;' ,'&#9857;' ,'&#9858;' ,'&#9859;' , '&#9860;' ,'&#9861;'];
                var stopped = true;
                // for keep on changing dice emojis
                function change() {
                    var random = Math.floor(Math.random() * 6);
                    dice.innerHTML = dices[random];
                }
                function stopStart() {
                    if (stopped) {
                        stopped = false;
                        //change function is called here to change the image for evry 0.1 seconds
                        t = setInterval(change,100);
                    } else {
                        clearInterval(t);
                        stopped = true;
                    }
                }
                // invoking function
                window.onload = function() {
                    dice = document.getElementById("dice");
                    stopStart();
                }
            </script>
        </center>
    </body>
</html>
