<head>
    <title>
        Perimeter Calculater
    </title>
</head>

<body>
    <h1>Perimeter Calculater</h1>
    <script>
        var choice = prompt("Welcome to Perimeter Calculater. \n Please Enter your Choice. \n1 .Perimeter of Rectangle. \n2 .Perimeter of Triangle. \n3.Perimeter of Circle. \n4 .Perimeter of Parallelogram. \n5 .Perimeter of Square");

        if (choice == '1') {
            var l = prompt('Enter the Length')
            var b = prompt('Enter the Breadth')
            var result = Number(l) + Number(b) * 2
            alert('The Perimeter is ' + result)
        }
        if (choice == '2') {
            var h = prompt('Enter the Height')
            var b = prompt('Enter the Base')
            var result = Number(h) + Number(b) + Number(h)
            alert('The Perimeter is ' + result)
        }
        if (choice == '3') {
            var r = prompt('Enter the radius')
            var result =  3.14 * Number(r) * Number(r) 
            alert('The Perimeter is ' + result)
        }
        if (choice == '4') {
            var h = prompt('Enter the Height')
            var cb = prompt('Enter the Corresponding Base')
            var result = Number(h) + Number(cb) * 2
            alert('The Perimeter is ' + result)
        }
         if (choice == '5') {
            var l = prompt('Enter the Length')
            var result = Number(l) * Number(4)
            alert('The Perimeter is ' + result)
        }
    </script>
</body>

</html>
