<head>
    <title>
        Area Calculater
    </title>
</head>

<body>
    <h1>Area Calculater</h1>
    <script>
        var choice = prompt("Welcome to Area Calculater. \n Please Enter your Choice. \n1 .Area of Rectangle. \n2 .Area of Triangle. \n3.Area of Circle. \n4 .Area of Parallelogram. \n5 .Area of Square");

        if (choice == '1') {
            var l = prompt('Enter the Length')
            var b = prompt('Enter the Breadth')
            var result = Number(l) * Number(b)
            alert('The Area is ' + result)
        }
        if (choice == '2') {
            var h = prompt('Enter the Height')
            var b = prompt('Enter the Base')
            var result = Number(h) * Number(b) / 2
            alert('The Area is ' + result)
        }
        if (choice == '3') {
            var r = prompt('Enter the radius')
            var result =  3.14 * Number(r) * Number(r) 
            alert('The Area is ' + result)
        }
        if (choice == '4') {
            var h = prompt('Enter the Height')
            var cb = prompt('Enter the Corresponding Base')
            var result = Number(h) * Number(cb)
            alert('The Area is ' + result)
        }
         if (choice == '5') {
            var l = prompt('Enter the Length')
            var result = Number(l) * Number(4)
            alert('The Area is ' + result)
        }
    </script>
</body>

</html>
